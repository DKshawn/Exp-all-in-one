<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>プレビュー</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/preview.js"></script>
  </head>
  <body class="preview-page">
    <header class="preview-toolbar">
      <a href="/admin" data-i18n="管理画面に戻る">管理画面に戻る</a>
      <strong data-i18n="プレビュー・結果は保存されません">プレビュー・結果は保存されません</strong>
      <div class="preview-size">
        <label class="sr-only" for="screen-size" data-i18n="画面サイズ">画面サイズ</label>
        <select id="screen-size"></select>
        <div id="custom-size" class="preview-custom" hidden>
          <label class="sr-only" for="screen-width" data-i18n="幅">幅</label>
          <input id="screen-width" type="number" min="240" max="3840" step="1" value="390" inputmode="numeric" required>
          <span aria-hidden="true">×</span>
          <label class="sr-only" for="screen-height" data-i18n="高さ">高さ</label>
          <input id="screen-height" type="number" min="320" max="2160" step="1" value="844" inputmode="numeric" required>
        </div>
      </div>
      <nav class="preview-navigation" aria-label="Preview">
        <button id="preview-previous" class="button secondary" disabled data-i18n="前へ">前へ</button>
        <span id="preview-progress" aria-live="polite"></span>
        <button id="preview-skip" class="button secondary" disabled data-i18n="回答せずに進む">回答せずに進む</button>
      </nav>
    </header>
    <main id="preview-stage" class="preview-stage">
      <div id="preview-frame-box" class="preview-frame-box">
        <iframe id="preview-frame" title="プレビュー"></iframe>
      </div>
    </main>
  </body>
</html>
